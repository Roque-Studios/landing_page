services:
  landing-page:
    build: .
    container_name: roque-studios-landing
    restart: unless-stopped

    ports:
      - "8090:80"

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /var/cache/nginx
      - /var/run

    depends_on:
      - leads-api

    networks:
      - landing

  leads-api:
    build: ./api
    container_name: roque-studios-leads-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?Missing .env - run: cp .env.example .env}"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://roquestudios.io}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-contacto@roquestudios.io}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - landing

  db:
    image: postgres:15-alpine
    container_name: roque-studios-leads-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Missing .env - run: cp .env.example .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Missing .env - run: cp .env.example .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Missing .env - run: cp .env.example .env}"
    volumes:
      - leads_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - landing

volumes:
  leads_db_data:

networks:
  landing:
    driver: bridge
